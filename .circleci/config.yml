# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  gcp-cli: circleci/gcp-cli@4.0.1
  secops: apollo/circleci-secops-orb@2.0.7

executors:
  # cypress requires xvfb to generate screenshots and recordings from browsers
  # keep this version in sync with .node-version
  node:
    docker:
      - image: cimg/node:22.23.2-browsers
    working_directory: ~/studio-landing-page

commands:
  npm-install:
    steps:
      - restore_cache:
          name: Restore npm cache
          keys:
            - npm-cache--{{ checksum "package-lock.json" }}--{{ checksum ".circleci/config.yml" }}
      - run:
          name: Install npm dependencies with `npm ci`
          command: npm ci --prefer-offline
      - save_cache:
          name: Save npm caches
          key: npm-cache--{{ checksum "package-lock.json" }}--{{ checksum ".circleci/config.yml" }}
          paths:
            - ~/.npm
jobs:
  lint:
    executor: node
    steps:
      - checkout
      - npm-install
      # Deliberately the same `npm run lint` a developer runs locally, so CI
      # cannot disagree with your machine. It maps to `biome check`, which does
      # lint + formatting + import-order in one pass and is non-mutating
      # (unlike `--write`), so it fails rather than silently reformatting.
      #
      # Biome replaced eslint + prettier and ~20 plugins. The old eslint cache
      # steps went with them: Biome checks this repo in ~10ms, so caching would
      # cost more than it saves.
      - run:
          name: Lint and format check (Biome)
          command: npm run lint

  typescript:
    executor: node
    steps:
      - checkout
      - npm-install
      - run:
          name: TypeScript
          command: npm run typescript:check

  build-storybook:
    executor: node
    resource_class: large
    steps:
      - checkout
      - npm-install
      - restore_cache:
          name: Restore storybook cache
          keys:
            - storybook-cache--{{ .Branch }}--{{ checksum ".circleci/config.yml" }}
            - storybook-cache--main--{{ checksum ".circleci/config.yml" }}
      - run:
          name: Build storybook
          command: npm run build-storybook -- --quiet
      - save_cache:
          name: Save storybook cache
          key: storybook-cache--{{ .Branch }}--{{ checksum ".circleci/config.yml" }}--{{ epoch }}
          paths:
            - node_modules/.cache/storybook
      - persist_to_workspace:
          root: ~/studio-landing-page
          paths:
            - .out

  build-latest-app:
    executor: node
    steps:
      - checkout
      - npm-install
      - run:
          name: Build
          command: '[ -d build ] || PUBLIC_URL=https://apollo-server-landing-page.cdn.apollographql.com/_latest npm run build -- --no-progress'
          environment:
            BUILD_TO_CDN: 'true'
      # This bundle is fetched at runtime by every self-hosted Apollo Server, so
      # the syntax level we emit is a compatibility contract with whatever
      # browsers those servers' users bring. Note tsconfig's `target: es5` does
      # NOT govern this -- tsc runs --noEmit (type-check only) and the real
      # transpilation is babel driven by `browserslist`.
      #
      # Asserting the *current* floor (ES2018, set by an object spread in
      # App.tsx's config defaults) makes any raise deliberate rather than
      # accidental: a toolchain change that starts emitting newer syntax fails
      # here instead of silently in someone's browser. browserslist currently
      # resolves to browsers that all support ES2020, so raising this is a
      # legitimate choice -- just make it a conscious one, and update the number
      # here in the same commit.
      - run:
          name: Assert browser syntax floor
          command: npm run check:browser-syntax
      - persist_to_workspace:
          root: ~/studio-landing-page
          paths:
            - build
            - cdn-lookup-key

  build-versioned-app:
    executor: node
    steps:
      - checkout
      - npm-install
      - run:
          name: Build
          command: '[ -d build ] || PUBLIC_URL=https://apollo-server-landing-page.cdn.apollographql.com/$CIRCLE_SHA1 npm run build -- --no-progress'
          environment:
            BUILD_TO_CDN: 'true'
      - persist_to_workspace:
          root: ~/studio-landing-page
          paths:
            - build
            - cdn-lookup-key

  chromatic:
    executor: node
    steps:
      - checkout
      - npm-install
      - attach_workspace:
          at: ~/studio-landing-page
      - run:
          name: Chromatic
          # TODO: auto-accept anything that hits main (add  < --auto-accept-changes=main > to the command)
          # (mostly for squash & merge commits where a PR is approved)
          environment:
            NODE_ENV: 'production'
          command: npm run chromatic -- --storybook-build-dir=.out --exit-once-uploaded --exit-zero-on-changes

  cdn-upload-latest:
    executor: gcp-cli/google
    steps:
      - gcp-cli/setup:
          gcloud_service_key: GCLOUD_GCS_SERVICE_KEY
      - checkout
      - attach_workspace:
          at: ~/studio-landing-page
      - run:
          name: Upload build artifacts to CDN
          command: |
            gsutil -m rsync -r ~/studio-landing-page/build gs://apollo-server-landing-page/_latest

  cdn-upload-versioned:
    executor: gcp-cli/google
    steps:
      - gcp-cli/setup:
          gcloud_service_key: GCLOUD_GCS_SERVICE_KEY
      - checkout
      - attach_workspace:
          at: ~/studio-landing-page
      - run:
          name: Upload build artifacts to CDN
          command: |
            gsutil -m rsync -r ~/studio-landing-page/build gs://apollo-server-landing-page/$CIRCLE_SHA1

workflows:
  build-test-deploy:
    jobs:
      - lint
      - typescript
      - build-storybook
      - build-latest-app
      - chromatic:
          requires:
            - build-storybook
            - lint
            - typescript
      - cdn-upload-latest:
          requires:
            - build-latest-app
          filters:
            branches:
              only: main
      - build-versioned-app:
          requires:
            - cdn-upload-latest
      - cdn-upload-versioned:
          requires:
            - build-versioned-app
          filters:
            branches:
              only: main
      # For running simple node tests, you could optionally use the node/test job from the orb to replicate and replace the job above in fewer lines.
      # - node/test
  security-scans:
    jobs:
      - secops/gitleaks:
          context:
            - github-orb
            - secops-oidc
          git-base-revision: <<#pipeline.git.base_revision>><<pipeline.git.base_revision>><</pipeline.git.base_revision >>
          git-revision: << pipeline.git.revision >>
      - secops/semgrep:
          context:
            - github-orb
            - secops-oidc
          git-base-revision: <<#pipeline.git.base_revision>><<pipeline.git.base_revision>><</pipeline.git.base_revision >>
